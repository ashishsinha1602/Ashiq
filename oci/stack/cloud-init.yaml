#cloud-config
# Installs schemagate and runs its MCP server as a systemd service.
# When catalog_provider is "oci" the instance principal catalogues the schema
# with OCI Generative AI on first boot -- no API key, nothing leaves the tenancy.
package_update: true
packages: [python3.11, python3.11-pip]
write_files:
  - path: /etc/schemagate.env
    # 0640 root:opc -- systemd reads it as root, and the documented re-run
    # (`sudo -u opc /opt/catalog-once.sh`) needs opc to read it too.
    permissions: "0640"
    owner: "root:opc"
    content: |
      SCHEMAGATE_DATABASE_URL=${database_url}
      SCHEMAGATE_CONNECT_ARGS='${connect_args}'
      SCHEMAGATE_MCP_TRANSPORT=streamable-http
      SCHEMAGATE_MCP_HOST=0.0.0.0
      SCHEMAGATE_MCP_PORT=${mcp_port}
      SCHEMAGATE_CATALOG_CONFIG=/etc/schemagate/catalog.json
      OCI_COMPARTMENT_ID=${compartment_ocid}
      OCI_REGION=${region}
      OCI_CLI_AUTH=instance_principal
      SCHEMAGATE_CREATE_ADB=${create_adb}
      SCHEMAGATE_ADB_DISPLAY_NAME=${adb_display_name}
      SCHEMAGATE_ADB_PASSWORD='${adb_admin_password}'
  - path: /etc/schemagate/catalog.json
    content: |
      {"restrict": {}, "hint": {}, "describe": {}}
  - path: /opt/pick-extras.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # The stack can point at any SQLAlchemy database, so install the driver
      # that matches the URL rather than assuming Oracle. Without this a
      # PostgreSQL or SQL Server URL fails at import with ModuleNotFoundError.
      set -a; . /etc/schemagate.env; set +a
      url="$SCHEMAGATE_DATABASE_URL"
      case "$url" in
        postgres*|postgresql*) extras="postgres" ;;
        mssql*)                extras="mssql" ;;
        mysql*|mariadb*)       extras="mysql" ;;
        *)                     extras="oracle" ;;
      esac
      echo "database URL scheme -> installing schemagate[$extras,mcp,oci]"
      /opt/schemagate/bin/pip install "schemagate[$extras,mcp,oci]"

  - path: /opt/catalog-once.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # One-off: describe the schema with OCI Generative AI, using the VM's
      # instance principal.
      #
      # This retries, and the reason is an ordering problem in the stack that
      # only shows up on a real apply. The dynamic group's matching rule needs
      # this instance's OCID, so Terraform cannot create the group or the
      # policy until after the instance exists -- and the instance is booting
      # and running this script by then. IAM authorisation also takes minutes
      # to propagate after the policy is written. A single attempt on first
      # boot therefore races the permission it needs and usually loses,
      # failing with NotAuthorizedOrNotFound.
      #
      # Failure after all attempts is not fatal: selection still works on
      # identifiers alone, and this script can be re-run by hand at any time.
      set -a; . /etc/schemagate.env; set +a
      [ "${catalog_provider}" = "oci" ] || exit 0
      log=/var/log/schemagate-catalog.log
      for attempt in $(seq 1 12); do
        echo "=== cataloguing attempt $attempt of 12 ($(date -Is)) ===" >> "$log"
        if /opt/schemagate/bin/schemagate describe \
             --url "$SCHEMAGATE_DATABASE_URL" \
             --provider oci --model "${catalog_model}" --all \
             --config /etc/schemagate/catalog.json >> "$log" 2>&1; then
          echo "cataloguing succeeded on attempt $attempt" >> "$log"
          chown opc:opc /etc/schemagate/catalog.json || true
          # The server read the catalog at start-up, so it needs to read it again.
          systemctl restart schemagate || true
          exit 0
        fi
        sleep 60
      done
      echo "cataloguing failed after 12 attempts -- selection still works on identifiers alone. Re-run: sudo OCI_CLI_AUTH=instance_principal /opt/catalog-once.sh" >> "$log"
      exit 1
  - path: /opt/resolve-db.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # Resolve the connection descriptor for the database this stack creates.
      #
      # Terraform cannot hand it to us. The database's access-control list has
      # to name this instance's public IP -- Oracle refuses one-way TLS on a
      # public database with no list -- so the database is created *after* the
      # instance. By the time it exists this machine is already booting, so we
      # look it up here with the instance principal and fill in the env file.
      #
      # When create_adb is false the operator supplied the URL and there is
      # nothing to resolve.
      set -a; . /etc/schemagate.env; set +a
      [ "$SCHEMAGATE_CREATE_ADB" = "true" ] || exit 0
      log=/var/log/schemagate-resolve-db.log

      # Provisioning an Autonomous Database takes minutes, and the IAM policy
      # that lets us read it is created alongside it, then has to propagate.
      for attempt in $(seq 1 60); do
        id="$(oci db autonomous-database list \
                --compartment-id "$OCI_COMPARTMENT_ID" \
                --display-name "$SCHEMAGATE_ADB_DISPLAY_NAME" \
                --lifecycle-state AVAILABLE \
                --query 'data[0].id' --raw-output 2>>"$log")"
        [ -n "$id" ] && [ "$id" != "null" ] && break
        echo "attempt $attempt: database not available yet ($(date -Is))" >> "$log"
        sleep 20
      done
      [ -n "$id" ] && [ "$id" != "null" ] || { echo "gave up waiting for the database" >> "$log"; exit 1; }

      dsn="$(oci db autonomous-database get --autonomous-database-id "$id" \
               --query 'data."connection-strings".profiles' --raw-output 2>>"$log" \
             | python3.11 -c 'import json,sys; ps=json.load(sys.stdin) or []; print(next((p["value"] for p in ps if p.get("tls-authentication")=="SERVER" and str(p.get("display-name","")).lower().endswith("_low")), ""))')"
      [ -n "$dsn" ] || { echo "no walletless _low profile on $id" >> "$log"; exit 1; }

      args="$(SG_DSN="$dsn" python3.11 -c 'import json,os; print(json.dumps({"user":"ADMIN","password":os.environ["SCHEMAGATE_ADB_PASSWORD"],"dsn":os.environ["SG_DSN"]}))')"
      # Replace the placeholder line rather than appending a second one.
      sed -i "s|^SCHEMAGATE_CONNECT_ARGS=.*|SCHEMAGATE_CONNECT_ARGS='$args'|" /etc/schemagate.env
      echo "resolved $id ($(date -Is))" >> "$log"
  - path: /etc/systemd/system/schemagate-catalog.service
    content: |
      [Unit]
      Description=schemagate one-off schema cataloguing
      After=schemagate.service
      [Service]
      Type=oneshot
      ExecStart=/opt/catalog-once.sh
      RemainAfterExit=yes
  - path: /etc/systemd/system/schemagate-resolve-db.service
    content: |
      [Unit]
      Description=schemagate: resolve the database connection descriptor
      [Service]
      Type=oneshot
      ExecStart=/opt/resolve-db.sh
      RemainAfterExit=yes
  - path: /etc/systemd/system/schemagate.service
    content: |
      [Unit]
      Description=schemagate MCP server
      After=network-online.target schemagate-resolve-db.service
      Wants=network-online.target
      # The server reads the connection descriptor at start-up, and when this
      # stack creates the database that descriptor is only known once
      # resolve-db has looked it up. It is a no-op for a supplied database_url.
      Requires=schemagate-resolve-db.service
      [Service]
      EnvironmentFile=/etc/schemagate.env
      ExecStart=/opt/schemagate/bin/python -m schemagate.mcp_server
      Restart=always
      RestartSec=5
      User=opc
      [Install]
      WantedBy=multi-user.target
runcmd:
  - python3.11 -m venv /opt/schemagate
  - /opt/schemagate/bin/pip install --upgrade pip
  - /opt/pick-extras.sh
  - chown -R opc:opc /opt/schemagate /etc/schemagate
  - firewall-cmd --permanent --add-port=${mcp_port}/tcp || true
  - firewall-cmd --reload || true
  - systemctl daemon-reload
  # resolve-db first: when this stack creates the database, the server has
  # nothing to connect to until the descriptor is looked up. It exits
  # immediately when the operator supplied database_url.
  - systemctl enable --now schemagate-resolve-db
  # Then the endpoint, on identifiers alone, with cataloguing behind it --
  # otherwise the retry loop above would hold the MCP server down for up to
  # twelve minutes waiting for an IAM policy to propagate.
  - systemctl enable --now schemagate
  - systemctl start --no-block schemagate-catalog
