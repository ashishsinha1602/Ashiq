# Resource Manager form definition (OCI Marketplace stack listing)
title: schemagate MCP server
description: Identity-scoped schema selection for text-to-SQL, served over MCP from an Always-Free-eligible VM against an Autonomous Database. Catalogued by OCI Generative AI with no API key. The instance installs the library from PyPI (https://pypi.org/project/schemagate/); if you already have a database, `pip install schemagate` needs none of this.
schemaVersion: 1.1.0
version: "0.1.14"
locale: en
variableGroups:
  - title: Where
    variables: [compartment_ocid, region]
  - title: Database
    variables: [create_adb, adb_version, adb_admin_password, adb_allowed_cidrs, database_url]
  - title: Cataloguing
    variables: [catalog_provider, catalog_model]
  - title: Instance
    variables: [ssh_public_key, instance_shape, instance_ocpus, instance_memory_gbs, availability_domain, allowed_cidr, ssh_cidr, mcp_port]
  - title: Advanced
    variables: [schemagate_version]
variables:
  schemagate_version:
    type: string
    title: schemagate version
    description: Version the instance installs from PyPI. Pinned to the version this stack was tested against, so a stack that worked when you downloaded it still works later. Leave empty to take whatever is newest.
    default: "0.1.14"
    required: false
  tenancy_ocid: { type: oci:identity:compartment:id, visible: false }
  region: { type: oci:identity:region:name, required: true, title: Region }
  compartment_ocid: { type: oci:identity:compartment:id, required: true, title: Compartment }
  adb_version:
    type: enum
    title: Autonomous Database version
    description: Autonomous Database version. 19c is the default because it is the one this stack has applied with, repeatedly. Always Free 26ai is offered in every commercial region except Bogota (BOG), Riyadh (RUH) and Singapore West (XSP) - set it if you want it.
    enum: ["19c", "26ai"]
    default: "19c"
    visible: create_adb
  create_adb:
    type: boolean
    title: Create an Always Free Autonomous Database
    default: true
  adb_admin_password:
    type: password
    title: ADMIN password for the new database
    visible: create_adb
    required: create_adb
    pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])[^\"']{12,30}$"
  database_url:
    type: password
    title: SQLAlchemy URL of your existing database
    visible: { not: [create_adb] }
    required: { not: [create_adb] }
  catalog_provider:
    type: enum
    title: Write table descriptions with
    description: OCI Generative AI catalogues the schema on first boot using the instance principal - no API key, and the prompt never leaves your tenancy. Descriptions roughly double business-language retrieval accuracy.
    enum: [oci, none]
    default: oci
  catalog_model:
    type: string
    title: OCI Generative AI model
    default: google.gemini-2.5-pro
    visible:
      eq: ["${catalog_provider}", "oci"]
  ssh_public_key: { type: oci:core:ssh:publickey, required: true, title: SSH public key }
  instance_shape:
    type: oci:core:instanceshape:name
    title: Shape
    default: VM.Standard.E2.1.Micro
    dependsOn: { compartmentId: "${compartment_ocid}" }
  adb_allowed_cidrs:
    type: array
    items: { type: string }
    required: false
    visible: create_adb
    title: Public CIDRs allowed to reach the database this stack creates
    description: Leave empty and the database is reachable over TLS with the ADMIN password only, which is fine for the throwaway demo. If you set it, include the instance's own public IP or the MCP server cannot connect.
  allowed_cidr: { type: string, required: true, title: CIDR allowed to reach the MCP endpoint (it has no auth of its own) }
  ssh_cidr: { type: string, required: true, title: CIDR allowed to SSH }
  instance_ocpus:
    type: number
    title: OCPUs (Flex shapes only)
    default: 1
  instance_memory_gbs:
    type: number
    title: Memory in GB (Flex shapes only)
    default: 6
  availability_domain:
    type: oci:identity:availabilitydomain:name
    title: Availability domain (blank = first; Always Free micro exists in only one)
    required: false
    dependsOn: { compartmentId: "${compartment_ocid}" }
  mcp_port: { type: number, title: MCP port, default: 8765 }
outputs:
  mcp_url: { title: MCP endpoint, type: link }
  catalogued_with: { title: Cataloguing, type: string }
