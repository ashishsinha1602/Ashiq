name: publish
on:
  release:
    types: [published]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  oci-stack:
    # The "Deploy to Oracle Cloud" button hands Resource Manager a zip URL, and
    # RM expects the .tf files at the ZIP ROOT -- a repo source archive nests
    # everything under a folder, so build a dedicated one and attach it to the
    # release. No Marketplace listing and no partner membership involved.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build the stack zip with the terraform at the root
        run: |
          cd oci/stack
          zip -r "$GITHUB_WORKSPACE/schemagate-oci-stack.zip" . -x '*.DS_Store'
          unzip -l "$GITHUB_WORKSPACE/schemagate-oci-stack.zip"
      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" schemagate-oci-stack.zip --clobber
